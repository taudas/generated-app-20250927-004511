<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="https://www.wcbn.org/favicon.ico">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#16161d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="https://www.wcbn.org/wcbn_images/wcbn-logo-gray.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WCBN-FM Ann Arbor - 3D Live Player</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Syncopate:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
  <!-- Three.js Canvas -->
  <canvas id="visualizer-canvas"></canvas>

  <!-- Overlay UI -->
  <div class="ui-container">
    <!-- Header -->
    <header class="app-header">
      <div class="logo-text">WCBN-FM</div>
      <div class="station-sub">88.3 FM Ann Arbor · Freeform Radio</div>
    </header>

    <!-- Center/Visualizer Instructions (Fades out after playback starts) -->
    <div id="intro-overlay" class="intro-overlay">
      <div class="intro-content">
        <h1>WCBN-FM</h1>
        <p>Click play to start the 3D Visual Audio Experience</p>
        <div class="button-wrapper">
          <button id="big-play-btn" class="glass-button play-pulse">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" style="vertical-align: middle; margin-right: 8px; display: inline-block;">
              <path d="M8 5v14l11-7z"/>
            </svg>
            PLAY
          </button>
          <div id="intro-loader" class="loader hidden"></div>
        </div>
      </div>
    </div>

    <!-- Bottom Glassmorphic Player Console -->
    <div class="player-console glass-panel">
      <!-- Track Info & Art -->
      <div class="track-info-container">
        <div class="album-art-wrapper">
          <img id="track-art" src="https://www.wcbn.org/wcbn_images/wcbn-logo-gray.png" alt="Album Art" class="album-art">
          <div class="art-glow"></div>
        </div>
        <div class="track-text">
          <h2 id="track-title" class="marquee-text">Loading Stream Info...</h2>
          <p id="track-artist">Retrieving Playlist...</p>
          <p id="track-album" class="album-name"></p>
        </div>
      </div>

      <!-- Playback Controls -->
      <div class="player-controls">
        <button id="play-pause-btn" class="control-btn play-btn" aria-label="Play">
          <!-- Play Icon SVG -->
          <svg id="play-icon" viewBox="0 0 24 24" width="24" height="24">
            <path fill="currentColor" d="M8 5v14l11-7z"/>
          </svg>
          <!-- Pause Icon SVG (hidden by default) -->
          <svg id="pause-icon" viewBox="0 0 24 24" width="24" height="24" class="hidden">
            <path fill="currentColor" d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
          </svg>
        </button>

        <div class="volume-container">
          <button id="mute-btn" class="mute-btn" aria-label="Mute">
            <!-- Speaker Icon -->
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
            </svg>
          </button>
          <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.8" class="volume-slider">
        </div>
      </div>

      <!-- Extra Settings/Visualizer Controls -->
      <div class="extra-controls">
        <div class="status-indicator">
          <span class="pulse-dot idle" id="status-dot"></span>
          <span id="status-text" class="status-text">OFFLINE</span>
        </div>
        <a href="https://www.wcbn.org/" target="_blank" rel="noopener noreferrer" class="glass-button mode-btn" style="text-decoration: none;">WCBN.ORG</a>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
